  ru: "Эта копия CC Same не может обновиться сама. Скачайте новую версию вручную."
"update.problem.translocated":
  en: "Move CC Same to the Applications folder, then try again."
  zh-CN: "请先把 CC Same 移到“应用程序”文件夹，再重试。"
  zh-TW: "請先將 CC Same 移到「應用程式」檔案夾，再試一次。"
  ja: "CC Same を「アプリケーション」フォルダに移動してから、もう一度お試しください。"
  ko: "CC Same를 응용 프로그램 폴더로 옮긴 다음 다시 시도하세요."
  fr: "Placez CC Same dans le dossier Applications, puis réessayez."
  de: "Bewege CC Same in den Ordner „Programme“ und versuche es erneut."
  es: "Mueve CC Same a la carpeta Aplicaciones y vuelve a intentarlo."
  pt-BR: "Mova o CC Same para a pasta Aplicativos e tente de novo."
  ru: "Переместите CC Same в папку «Программы» и попробуйте снова."
"update.problem.read_only":
  en: "CC Same isn’t allowed to replace itself where it’s installed. Download the new version instead."
  zh-CN: "CC Same 没有权限替换安装位置里的自己，请直接下载新版本。"
  zh-TW: "CC Same 沒有權限取代安裝位置裡的自己，請直接下載新版本。"
  ja: "CC Same にはインストール先で自身を置き換える権限がありません。新しいバージョンをダウンロードしてください。"
  ko: "CC Same가 설치된 위치에서 자신을 바꿀 권한이 없습니다. 새 버전을 직접 다운로드하세요."
  fr: "CC Same n’a pas le droit de se remplacer là où il est installé. Téléchargez plutôt la nouvelle version."
  de: "CC Same darf sich dort, wo es installiert ist, nicht ersetzen. Lade stattdessen die neue Version herunter."
  es: "CC Same no tiene permiso para reemplazarse donde está instalado. Descarga la nueva versión."
  pt-BR: "O CC Same não tem permissão para se substituir onde está instalado. Baixe a nova versão."
  ru: "CC Same не может заменить себя там, где установлен. Скачайте новую версию вручную."
"update.problem.unverified":
  en: "The download didn’t pass CC Same’s checks, so nothing was changed."
  zh-CN: "下载的文件没有通过 CC Same 的校验，所以没有做任何改动。"
  zh-TW: "下載的檔案沒有通過 CC Same 的檢查，所以沒有做任何變更。"
  ja: "ダウンロードしたファイルが CC Same の検証を通らなかったため、何も変更していません。"
  ko: "다운로드한 파일이 CC Same의 검사를 통과하지 못해 아무것도 바꾸지 않았습니다."
  fr: "Le téléchargement n’a pas passé les vérifications de CC Same : rien n’a été modifié."
  de: "Der Download hat die Prüfungen von CC Same nicht bestanden, daher wurde nichts geändert."
  es: "La descarga no pasó las comprobaciones de CC Same, así que no se cambió nada."
  pt-BR: "O download não passou nas verificações do CC Same, então nada foi alterado."
  ru: "Загрузка не прошла проверки CC Same, поэтому ничего не изменено."
