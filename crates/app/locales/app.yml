  ja: "すべてのアカウントのセッション一覧がその時点に戻ります。現在の一覧は先にスナップショットとして保存されます。"
  ko: "모든 계정의 세션 목록이 그 시점으로 돌아갑니다. 현재 목록은 먼저 스냅샷으로 저장됩니다."
