"signin.keeps":
  en: "CC Same keeps %{account} signed in, so you can switch back in one click."
  zh-CN: "CC Same 会保留 %{account} 的登录，之后一键就能切回来。"
  zh-TW: "CC Same 會保留 %{account} 的登入，之後一鍵就能切回來。"
  ja: "%{account} のサインインは CC Same が保持するので、ワンクリックで戻せます。"
  ko: "CC Same가 %{account} 계정의 로그인을 보관하므로 클릭 한 번으로 돌아올 수 있습니다."
  fr: "CC Same garde %{account} connecté : vous pourrez y revenir en un clic."
  de: "CC Same hält %{account} angemeldet, sodass du mit einem Klick zurückwechseln kannst."
  es: "CC Same mantiene la sesión de %{account}, así que podrás volver con un clic."
  pt-BR: "O CC Same mantém o login de %{account}, para você voltar com um clique."
  ru: "CC Same сохранит вход в %{account}, чтобы вернуться одним щелчком."
"signin.tip":
  en: "From now on, switch here or from the menu bar. Logging out in Claude ends a sign-in for good."
  zh-CN: "以后在这里或菜单栏切换账号。在 Claude 里退出登录会让这个登录彻底失效。"
  zh-TW: "之後在這裡或選單列切換帳號。在 Claude 裡登出會讓這個登入徹底失效。"
  ja: "今後はここかメニューバーから切り替えてください。Claude でログアウトすると、そのサインインは完全に無効になります。"
  ko: "앞으로는 여기나 메뉴 막대에서 전환하세요. Claude에서 로그아웃하면 그 로그인은 완전히 무효가 됩니다."
  fr: "Ensuite, changez de compte ici ou depuis la barre des menus. Se déconnecter dans Claude met fin à une connexion pour de bon."
  de: "Wechsle künftig hier oder über die Menüleiste. Abmelden in Claude beendet eine Anmeldung endgültig."
  es: "A partir de ahora, cambia aquí o desde la barra de menús. Cerrar sesión en Claude termina una sesión para siempre."
  pt-BR: "Daqui em diante, troque aqui ou pela barra de menus. Sair no Claude encerra um login de vez."
  ru: "Дальше переключайтесь здесь или в строке меню. Выход в Claude завершает вход навсегда."
