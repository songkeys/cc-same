"reset.hint":
  en: "Pick the day and enter the time the weekly limit resets to see how long is left. Leave the time empty to stop."
  zh-CN: "选好星期几并填写每周额度的重置时间，就会显示距离重置还剩多久。时间留空即不显示。"
  zh-TW: "選好星期幾並填寫每週額度的重置時間，就會顯示距離重置還剩多久。時間留空即不顯示。"
  ja: "曜日を選んで週間上限のリセット時刻を入力すると、リセットまでの残り時間を表示します。時刻を空にすると表示しません。"
  ko: "요일을 고르고 주간 한도가 초기화되는 시각을 입력하면 남은 시간이 표시됩니다. 시각을 비워 두면 표시하지 않습니다."
  fr: "Choisissez le jour et l’heure où la limite hebdomadaire se réinitialise pour voir le temps restant. Laissez l’heure vide pour ne plus l’afficher."
  de: "Wählen Sie Tag und Uhrzeit, zu der das Wochenlimit zurückgesetzt wird, um die verbleibende Zeit zu sehen. Leere Uhrzeit blendet sie aus."
  es: "Elige el día y la hora en que se reinicia el límite semanal para ver cuánto falta. Deja la hora vacía para no mostrarlo."
  pt-BR: "Escolha o dia e a hora em que o limite semanal renova para ver quanto falta. Deixe a hora vazia para não mostrar."
  ru: "Выберите день и время сброса недельного лимита, чтобы видеть, сколько осталось. Оставьте время пустым, чтобы не показывать."
