  zh-TW: "如果一直這樣，請到「系統設定 › 一般 › 登入項目與延伸功能」裡允許它在背景執行。"
  ja: "この状態が続く場合は、「システム設定 › 一般 › ログイン項目と機能拡張」でバックグラウンドでの実行を許可してください。"
  ko: "계속 이 상태라면 시스템 설정 › 일반 › 로그인 항목 및 확장 프로그램에서 백그라운드 실행을 허용하세요."
  fr: "Si cela persiste, autorisez-la dans Réglages Système › Général › Ouverture et extensions."
  de: "Bleibt es so, erlaube sie unter Systemeinstellungen › Allgemein › Anmeldeobjekte & Erweiterungen."
