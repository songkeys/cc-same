"remove.body":
  en: "CC Same forgets the sign-in it keeps for this account. Its sessions stay. To add it back, sign in to it in Claude."
  zh-CN: "CC Same 会删除为这个账号保留的登录。会话都会保留；之后在 Claude 里登录它即可重新加入。"
  zh-TW: "CC Same 會刪除為這個帳號保留的登入。工作階段都會保留；之後在 Claude 裡登入它即可重新加入。"
  ja: "CC Same はこのアカウント用に保管しているサインインを削除します。セッションは残ります。Claude でサインインすると、また追加されます。"
  ko: "CC Same이 이 계정에 대해 보관한 로그인을 지웁니다. 세션은 그대로 남습니다. Claude에서 다시 로그인하면 목록에 다시 추가됩니다."
  fr: "CC Same oublie la connexion qu’il garde pour ce compte. Ses sessions restent. Pour le rajouter, connectez-vous-y dans Claude."
  de: "CC Same vergisst die für dieses Konto aufbewahrte Anmeldung. Die Sitzungen bleiben. Um es wieder hinzuzufügen, melde dich in Claude damit an."
  es: "CC Same olvida el inicio de sesión que guarda para esta cuenta. Las sesiones se quedan. Para volver a añadirla, inicia sesión con ella en Claude."
  pt-BR: "O CC Same esquece o login que guarda para esta conta. As sessões ficam. Para adicioná-la de novo, entre com ela no Claude."
  ru: "CC Same забудет сохранённый вход в этот аккаунт. Сессии останутся. Чтобы вернуть аккаунт, войдите в него в Claude."
