"name.body":
  en: "Shown in the list instead of the email or ID. The command line takes it too, wherever it asks for an account."
  zh-CN: "列表里会用它代替邮箱或 ID 显示；命令行里要指定账号时也能用它。"
  zh-TW: "列表裡會用它代替電子郵件或 ID 顯示；命令列裡要指定帳號時也能用它。"
  ja: "一覧ではメールアドレスや ID の代わりにこの名前を表示します。コマンドラインでアカウントを指定するときにも使えます。"
  ko: "목록에서 이메일이나 ID 대신 이 이름이 표시됩니다. 명령줄에서 계정을 지정할 때도 쓸 수 있습니다."
  fr: "La liste l’affiche à la place de l’e-mail ou de l’identifiant. La ligne de commande l’accepte aussi partout où elle demande un compte."
  de: "Die Liste zeigt ihn statt der E-Mail-Adresse oder ID. Die Befehlszeile versteht ihn überall, wo sie ein Konto erwartet."
  es: "La lista lo muestra en lugar del correo o el ID. La línea de comandos también lo acepta donde pide una cuenta."
  pt-BR: "A lista mostra este nome no lugar do e-mail ou do ID. A linha de comando também o aceita onde pede uma conta."
  ru: "В списке он показывается вместо почты или ID. Командная строка тоже понимает его везде, где нужно указать аккаунт."
