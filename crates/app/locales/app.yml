  zh-CN: "Claude Code 会删除较早的对话记录，没有记录的会话打开是空的。"
  zh-TW: "Claude Code 會刪除較早的對話記錄，沒有記錄的工作階段打開是空的。"
  ja: "Claude Code は古い会話記録を削除します。記録がないセッションは開いても空です。"
  ko: "Claude Code는 오래된 대화 기록을 삭제하며, 기록이 없는 세션은 열어도 비어 있습니다."
  fr: "Claude Code supprime les anciennes transcriptions, et une session s’ouvre vide sans la sienne."
  de: "Claude Code löscht ältere Transkripte, und ohne Transkript öffnet sich eine Sitzung leer."
  es: "Claude Code borra las transcripciones antiguas, y una sesión sin la suya se abre vacía."
  pt-BR: "O Claude Code apaga transcrições antigas, e uma sessão sem a sua abre vazia."
  ru: "Claude Code удаляет старые записи бесед, а без записи сессия открывается пустой."
"settings.changed":
  en: "CC Same changed this in Claude Code’s settings."
  zh-CN: "这是 CC Same 在 Claude Code 设置里改的。"
  zh-TW: "這是 CC Same 在 Claude Code 設定裡改的。"
  ja: "これは CC Same が Claude Code の設定で変更したものです。"
