  pt-BR: "Se continuar assim, permita em Ajustes do Sistema › Geral › Itens de Início e Extensões."
  ru: "Если так и останется, разрешите фоновую работу: Системные настройки › Основные › Объекты входа и расширения."
"background.move_first":
