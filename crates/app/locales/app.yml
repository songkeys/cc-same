"name.hint":
  en: "Up to %{max} letters, digits or - _ . with no spaces. Leave it empty to remove the name."
  zh-CN: "最多 %{max} 个字符，可用文字、数字及 - _ .，不含空格。留空即不命名。"
  zh-TW: "最多 %{max} 個字元，可用文字、數字及 - _ .，不含空格。留空即不命名。"
  ja: "文字・数字と - _ . を %{max} 字まで使えます。スペースは使えません。空にすると名前を外します。"
  ko: "글자·숫자와 - _ . 를 최대 %{max}자까지 쓸 수 있고, 공백은 안 됩니다. 비워 두면 이름이 지워집니다."
  fr: "Jusqu’à %{max} caractères : lettres, chiffres, - _ . et pas d’espaces. Laissez vide pour retirer le nom."
  de: "Bis zu %{max} Zeichen: Buchstaben, Ziffern, - _ . und keine Leerzeichen. Leer lassen, um den Namen zu entfernen."
  es: "Hasta %{max} caracteres: letras, cifras, - _ . y sin espacios. Déjalo vacío para quitar el nombre."
  pt-BR: "Até %{max} caracteres: letras, números, - _ . e sem espaços. Deixe vazio para tirar o nome."
  ru: "До %{max} символов: буквы, цифры, - _ . и без пробелов. Оставьте пустым, чтобы убрать имя."
"name.invalid":
  en: "Use up to %{max} letters, digits, - _ or . with no spaces, not only digits, and not starting with -."
  zh-CN: "名字只能用文字、数字和 - _ .，最多 %{max} 个字符；不能有空格、不能全是数字、不能以 - 开头。"
  zh-TW: "名字只能用文字、數字和 - _ .，最多 %{max} 個字元；不能有空格、不能全是數字、不能以 - 開頭。"
  ja: "使えるのは文字・数字と - _ . の %{max} 字までです。スペース、数字だけ、- で始まる名前は使えません。"
  ko: "글자·숫자와 - _ . 만 최대 %{max}자까지 쓸 수 있습니다. 공백, 숫자만 있는 이름, - 로 시작하는 이름은 안 됩니다."
  fr: "Utilisez jusqu’à %{max} lettres, chiffres, - _ ou . : sans espaces, pas uniquement des chiffres, sans - au début."
  de: "Erlaubt sind bis zu %{max} Buchstaben, Ziffern, - _ oder . – ohne Leerzeichen, nicht nur Ziffern, nicht mit - am Anfang."
  es: "Usa hasta %{max} letras, cifras, - _ o . : sin espacios, no solo cifras y sin - al principio."
  pt-BR: "Use até %{max} letras, números, - _ ou . : sem espaços, não só números e sem - no começo."
  ru: "Можно до %{max} букв, цифр, - _ или . — без пробелов, не только цифры и не с - в начале."
