  fr: "Cette copie de CC Same ne peut pas se mettre à jour elle-même. Téléchargez plutôt la nouvelle version."
  de: "Diese Kopie von CC Same kann sich nicht selbst aktualisieren. Lade stattdessen die neue Version herunter."
  es: "Esta copia de CC Same no puede actualizarse sola. Descarga la nueva versión."
