"quit.confirming":
  en: "Claude is asking whether to stop its work in progress. Answer it in Claude."
  zh-CN: "Claude 正在询问是否停止进行中的工作，请在 Claude 里回答。"
  zh-TW: "Claude 正在詢問是否停止進行中的工作，請在 Claude 裡回答。"
  ja: "Claude が進行中の作業を止めるかどうか確認しています。Claude で答えてください。"
  ko: "Claude가 진행 중인 작업을 멈출지 묻고 있습니다. Claude에서 답해 주세요."
  fr: "Claude demande s’il faut arrêter le travail en cours. Répondez dans Claude."
  de: "Claude fragt, ob laufende Arbeit abgebrochen werden soll. Antworte in Claude."
  es: "Claude pregunta si debe detener el trabajo en curso. Responde en Claude."
  pt-BR: "O Claude está perguntando se deve parar o trabalho em andamento. Responda no Claude."
  ru: "Claude спрашивает, остановить ли текущую работу. Ответьте в Claude."
"quit.after_work":
  en: "Claude quits once its work in progress is done, and CC Same carries on then."
  zh-CN: "Claude 会在进行中的工作完成后退出，CC Same 随后继续。"
  zh-TW: "Claude 會在進行中的工作完成後結束，CC Same 隨後繼續。"
  ja: "Claude は進行中の作業が終わってから終了し、そのあと CC Same が続けます。"
  ko: "Claude는 진행 중인 작업을 마친 뒤 종료되고, 그다음 CC Same이 이어서 진행합니다."
  fr: "Claude quittera une fois le travail en cours terminé, puis CC Same prendra le relais."
  de: "Claude beendet sich, sobald die laufende Arbeit fertig ist; dann macht CC Same weiter."
  es: "Claude se cerrará cuando termine el trabajo en curso y entonces CC Same continuará."
  pt-BR: "O Claude vai fechar quando terminar o trabalho em andamento, e então o CC Same continua."
  ru: "Claude закроется, когда закончит текущую работу, и тогда CC Same продолжит."
"quit.stop":
