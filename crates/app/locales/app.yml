"headline.single.detail":
  en: "Sign in to another account in Claude, and it joins automatically."
  zh-CN: "在 Claude 里登录另一个账号，它会自动加入同步。"
  zh-TW: "在 Claude 中登入另一個帳號，它會自動加入同步。"
  ja: "Claude で別のアカウントにサインインすると、自動で同期に加わります。"
  ko: "Claude에서 다른 계정으로 로그인하면 자동으로 동기화에 참여합니다."
  fr: "Connectez-vous à un autre compte dans Claude : il rejoindra la synchronisation tout seul."
  de: "Melde dich in Claude bei einem weiteren Konto an – es wird automatisch einbezogen."
  es: "Inicia sesión con otra cuenta en Claude y se unirá automáticamente."
  pt-BR: "Entre com outra conta no Claude e ela participa automaticamente."
