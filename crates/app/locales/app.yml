  de: "CC Same hat diese Einstellung von Claude Code geändert."
  es: "CC Same cambió este ajuste de Claude Code."
  pt-BR: "O CC Same alterou esta configuração do Claude Code."
  ru: "CC Same изменил эту настройку Claude Code."
