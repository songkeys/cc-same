"fix.body":
  en: "Each linked session folder becomes a real folder holding a copy of what it pointed to. Nothing is deleted."
  zh-CN: "每个被链接的会话文件夹都会变回真正的文件夹，里面是它原来指向内容的副本。不会删除任何东西。"
  zh-TW: "每個被連結的工作階段資料夾都會變回真正的資料夾，裡面是它原本指向內容的副本。不會刪除任何東西。"
  ja: "リンクされたセッションフォルダは、リンク先の内容をコピーした通常のフォルダになります。何も削除されません。"
  ko: "연결된 세션 폴더는 가리키던 내용의 복사본을 담은 실제 폴더가 됩니다. 아무것도 삭제되지 않습니다."
  fr: "Chaque dossier de sessions lié devient un vrai dossier contenant une copie de sa cible. Rien n’est supprimé."
  de: "Jeder verknüpfte Sitzungsordner wird zu einem echten Ordner mit einer Kopie dessen, worauf er gezeigt hat. Nichts wird gelöscht."
  es: "Cada carpeta de sesiones enlazada pasa a ser una carpeta real con una copia de su destino. No se borra nada."
  pt-BR: "Cada pasta de sessões vinculada vira uma pasta de verdade, com uma cópia do destino. Nada é apagado."
  ru: "Каждая связанная папка сессий станет настоящей папкой с копией того, на что она указывала. Ничего не удаляется."
