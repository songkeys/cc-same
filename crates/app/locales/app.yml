"update.problem.not_installed":
  en: "This copy of CC Same can’t update itself. Download the new version instead."
  zh-CN: "这份 CC Same 无法自行更新，请直接下载新版本。"
  zh-TW: "這份 CC Same 無法自行更新，請直接下載新版本。"
  ja: "この CC Same は自動でアップデートできません。新しいバージョンをダウンロードしてください。"
