  zh-CN: "已停止等待，什么都没改。"
  zh-TW: "已停止等待，什麼都沒改。"
  ja: "待つのをやめました。何も変更していません。"
  ko: "기다리기를 멈췄습니다. 아무것도 바뀌지 않았습니다."
  fr: "Attente arrêtée. Rien n’a changé."
  de: "Warten beendet. Nichts wurde geändert."
  es: "Se dejó de esperar. No cambió nada."
  pt-BR: "Parou de esperar. Nada mudou."
  ru: "Ожидание остановлено. Ничего не изменилось."
"switch.stopped_after_work":
  en: "Stopped waiting. Nothing changed, but Claude still quits once its work is done, as you chose."
  zh-CN: "已停止等待，什么都没改。不过按你在 Claude 里的选择，它仍会在工作完成后退出。"
  zh-TW: "已停止等待，什麼都沒改。不過依照你在 Claude 裡的選擇，它仍會在工作完成後結束。"
  ja: "待つのをやめました。何も変更していませんが、選んだとおり Claude は作業が終わると終了します。"
  ko: "기다리기를 멈췄습니다. 바뀐 것은 없지만, 선택한 대로 Claude는 작업을 마치면 종료됩니다."
  fr: "Attente arrêtée. Rien n’a changé, mais Claude quittera quand même une fois son travail terminé, comme vous l’avez choisi."
  de: "Warten beendet. Nichts wurde geändert, aber Claude beendet sich wie gewählt trotzdem, sobald die Arbeit fertig ist."
  es: "Se dejó de esperar. No cambió nada, pero Claude se cerrará igualmente al terminar su trabajo, como elegiste."
  pt-BR: "Parou de esperar. Nada mudou, mas o Claude ainda vai fechar quando terminar o trabalho, como você escolheu."
  ru: "Ожидание остановлено. Ничего не изменилось, но Claude всё равно закроется, когда закончит работу, как вы выбрали."
