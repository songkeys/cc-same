[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]
# The desktop app is a workspace of its own, so building or installing the command-line tool
# never downloads the GUI framework. Build it with `cargo app` (see .cargo/config.toml).
exclude = ["crates/app"]

[workspace.package]
version = "0.1.10"
edition = "2021"
license = "MIT"
repository = "https://github.com/songkeys/cc-same"
homepage = "https://github.com/songkeys/cc-same"
rust-version = "1.85"

[workspace.dependencies]
cc-same-core = { path = "crates/core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
libc = "0.2"
reflink-copy = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
